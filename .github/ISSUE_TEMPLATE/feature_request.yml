name: Feature request
description: Suggest an idea or improvement for Orbis.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Orbis to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do in game where this would make a difference?
