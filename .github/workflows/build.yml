name: Build Orbis
on:
  push:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tools/**'
      - 'spec/**'
      - 'analysis/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
concurrency:
  group: orbis-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            debug: 'false'
            output: build
          - variant: debug
            debug: 'true'
            output: build/debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, regression tests and exact artifact verification
        run: bash gradlew build -PorbisDebug=${{ matrix.debug }} --no-daemon --stacktrace
      - name: Upload mod JAR and sources
        uses: actions/upload-artifact@v4
        with:
          name: orbis-fabric-26.3-${{ matrix.variant }}
          path: ${{ matrix.output }}/libs/*.jar
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.variant }}
          path: |
            ${{ matrix.output }}/reports/tests/
            ${{ matrix.output }}/test-results/
          if-no-files-found: ignore
