name: Build Orbis
on:
  push:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tools/**'
      - 'spec/**'
      - 'analysis/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
concurrency:
  group: orbis-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            debug: 'false'
            output: build
          - variant: debug
            debug: 'true'
            output: build/debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build, regression tests and exact artifact verification
        run: bash gradlew build -PorbisDebug=${{ matrix.debug }} --no-daemon --stacktrace
      - name: Play the seam in Minecraft (client game test under Xvfb)
        if: matrix.variant == 'normal'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" glxinfo -B | head -20
          # If the game is still running after ten minutes it is stuck: print thread dumps every two minutes.
          (
            sleep 600
            while true; do
              for pid in $(jps -l | grep -v -i -e gradle -e jps | awk '{print $1}'); do
                echo "=== jstack $pid at $(date -u +%T)"
                jstack "$pid" | head -n 800
              done
              sleep 120
            done
          ) &
          watchdog=$!
          set +e
          timeout 20m xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            bash gradlew runClientGameTest --no-daemon --stacktrace
          status=$?
          kill "$watchdog" 2> /dev/null
          for log in $(find build/run -path '*logs/latest.log'); do echo "=== tail $log"; tail -n 150 "$log"; done
          exit $status
      - name: Upload game test screenshots and log
        if: always() && matrix.variant == 'normal'
        uses: actions/upload-artifact@v4
        with:
          name: orbis-seam-game-test
          path: |
            build/run/**/screenshots/*.png
            build/run/**/logs/latest.log
          if-no-files-found: ignore
      - name: Upload mod JAR and sources
        uses: actions/upload-artifact@v4
        with:
          name: orbis-fabric-26.3-${{ matrix.variant }}
          path: ${{ matrix.output }}/libs/*.jar
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.variant }}
          path: |
            ${{ matrix.output }}/reports/tests/
            ${{ matrix.output }}/test-results/
          if-no-files-found: ignore
