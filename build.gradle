plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
def debugBuild = providers.gradleProperty('orbisDebug').map { it.toBoolean() }.getOrElse(false)
version = project.mod_version + (debugBuild ? '-debug' : '')
// Separate outputs prevent stale debug classes leaking into a subsequent release build.
layout.buildDirectory = layout.projectDirectory.dir(debugBuild ? 'build/debug' : 'build')
if (debugBuild) {
    sourceSets.main.java.srcDir 'src/debug/java'
    sourceSets.main.resources.srcDir 'src/debug/resources'
    sourceSets.test.java.srcDir 'src/debugTest/java'
}
group = project.maven_group
base { archivesName = 'orbis' }
repositories {
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'version', project.version
    inputs.property 'orbisDebug', debugBuild
    filesMatching('fabric.mod.json') { expand version: project.version }
    doLast {
        if (debugBuild) {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(manifest)
            metadata.entrypoints.client.remove('dev.orbis.client.PlayerMinimap')
            metadata.entrypoints.client += 'dev.orbis.debug.OrbisDebugClient'
            manifest.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)), 'UTF-8')
        }
    }
}
test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    systemProperty 'orbis.expectedVersion', project.version.toString()
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}
jar {
    from('LICENSE') { rename { 'LICENSE-orbis' } }
    from('licenses') { into 'META-INF/licenses' }
}

apply from: "engine.gradle"
apply from: "tools/distribution.gradle"

if (debugBuild) {
    // The regular suite also verifies the optional importer with no DH classes installed.
    def dhTestJar = configurations.compileClasspath.filter {
        it.name.startsWith('distanthorizons-') && it.name.endsWith('.jar')
    }
    dependencies { testCompileOnly files(dhTestJar) }
    test { exclude '**/AtlasDistantTerrainTest.class' }
    tasks.register('testDistantTerrain', Test) {
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath + (providers.gradleProperty('orbisDhTestJar').isPresent()
                ? files(providers.gradleProperty('orbisDhTestJar').get()) : dhTestJar)
        useJUnitPlatform()
        systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        include '**/AtlasDistantTerrainTest.class'
        workingDir = layout.buildDirectory.dir('dh-test-run').get().asFile
        doFirst { workingDir.mkdirs() }
        shouldRunAfter test
    }
    tasks.named('check') { dependsOn tasks.named('testDistantTerrain') }
}
