// Immutable MIT source snapshot: no Toroidal World binary, runtime mod or network fetch.
def engineArchive = file('vendor/toroidal-engine-0600806.zip')
def engineRoot = layout.buildDirectory.dir('vendor/engine')
def patchFile = file('vendor/engine-patches.json')
def engineHash = '8fc7a18de0dfcbefae77059c2f2636d1adb8c8bc177357706db40869ac0709f3'

def prepareEngine = tasks.register('prepareEngine', Sync) {
    inputs.file(patchFile)
    from(zipTree(engineArchive))
    into(engineRoot)
    doFirst {
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(engineArchive.bytes).encodeHex().toString()
        if (actual != engineHash) throw new GradleException('Vendored engine checksum mismatch')
    }
    doLast {
        new groovy.json.JsonSlurper().parse(patchFile).each { patch ->
            def target = new File(engineRoot.get().asFile, patch.file)
            def original = target.getText('UTF-8')
            if (original.count(patch.before) != 1) throw new GradleException("Engine patch mismatch: ${patch.file}")
            target.setText(original.replace(patch.before, patch.after), 'UTF-8')
        }
    }
}

sourceSets.main {
    java.srcDirs engineRoot.map { it.dir('common/src/main/java') }, engineRoot.map { it.dir('fabric/src/main/java') }
    resources {
        srcDir engineRoot.map { it.dir('common/src/main/resources') }
        // Fabric metadata and access widener live in Orbis's own resources.
        srcDir engineRoot.map { it.dir('fabric/src/main/resources') }
        exclude 'META-INF/accesstransformer.cfg', 'logo.png', '**/*.bbmodel'
        // Built-in Toroidal/Cylinder presets are not Orbis's preset policy.
        exclude 'data/toroidal_world/worldgen/world_preset/**'
        // Orbis owns its progression and player-facing wording.
        exclude 'data/toroidal_world/advancement/**'
    }
}
// Avoid two root mod manifests and two copies of the access widener.
processResources {
    dependsOn prepareEngine
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude { entry ->
        entry.file.toPath().startsWith(engineRoot.get().asFile.toPath()) &&
                (entry.name in ['fabric.mod.json', 'toroidal_world.accesswidener'] ||
                 entry.path.startsWith('assets/toroidal_world/lang/'))
    }
}
compileJava.dependsOn prepareEngine
sourcesJar.dependsOn prepareEngine
sourcesJar.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
loom { accessWidenerPath = file('src/main/resources/toroidal_world.accesswidener') }

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.bawnorton.com/releases'; content { includeGroup 'com.github.bawnorton.mixinsquared' } }
    maven { url = 'https://maven.terraformersmc.com/releases'; content { includeGroup 'com.terraformersmc' } }
}
configurations { c2meModules; xaeroLib }
dependencies {
    c2meModules 'maven.modrinth:c2me-neoforge:0.4.2-alpha.0.100+26.3'
    xaeroLib 'maven.modrinth:xaeros-world-map:neoforge-26.3-1.46.3'
}
def c2meModules = tasks.register('unpackC2meModules', Sync) {
    from(zipTree(configurations.c2meModules.singleFile)) {
        include 'META-INF/jars/c2me-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('c2me-modules')
}
def xaeroLib = tasks.register('unpackXaeroLib', Sync) {
    from(zipTree(configurations.xaeroLib.singleFile)) {
        include 'META-INF/jarjar/xaerolib-*.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('xaerolib')
}
dependencies {
    compileOnly files(c2meModules).asFileTree.matching { include '*.jar' }
    compileOnly files(xaeroLib).asFileTree.matching { include '*.jar' }
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
    include(implementation('com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.3'))
    compileOnly 'info.journeymap:journeymap-api-neoforge:26.3-2.0.0'
    compileOnly 'maven.modrinth:journeymap:26.3-6.0.8+neoforge'
    compileOnly 'maven.modrinth:xaeros-minimap:neoforge-26.3-26.5.2'
    compileOnly 'maven.modrinth:xaeros-world-map:neoforge-26.3-1.46.3'
    compileOnly 'maven.modrinth:distanthorizons:3.3.0-26.3'
    compileOnly 'maven.modrinth:terrablender:Z28Rt8Ne'
    compileOnly 'maven.modrinth:biolith:1B9gQ2cQ'
    compileOnly 'maven.modrinth:sodium:mc26.3-0.9.2-fabric'
    compileOnly 'com.terraformersmc:modmenu:21.0.0-beta.1'
}
